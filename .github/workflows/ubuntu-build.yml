name: Ubuntu Build

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build on Ubuntu 22.04
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libgtk-3-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libserialport-dev \
            libpaho-mqtt-dev

      - name: Configure manager components
        run: cmake -S . -B build-manager -DIPAD_BUILD_TESTS=ON

      - name: Build manager components
        run: cmake --build build-manager --parallel

      - name: Run manager tests
        run: ctest --test-dir build-manager --output-on-failure

      - name: Check packaging files
        run: |
          test -f packaging/systemd/ipad-managerd.service
          test -f packaging/tmpfiles/ipad-manager.conf
          test -f packaging/README.md
          test -f packaging/config/mock.config.json
          test -f packaging/config/at-serial.config.json
          test -f packaging/openrc/ipad-managerd
          test -f packaging/sysvinit/ipad-managerd
          test -f packaging/manual/README.md
          test -f docs/quick-start.md
          grep -q 'RuntimeDirectory=ipad-manager' packaging/systemd/ipad-managerd.service
          grep -q 'StateDirectory=ipad-manager' packaging/systemd/ipad-managerd.service
          grep -q 'LogsDirectory=ipad-manager' packaging/systemd/ipad-managerd.service
          grep -q 'SupplementaryGroups=dialout' packaging/systemd/ipad-managerd.service
          grep -q 'ipadctl doctor' docs/quick-start.md
          grep -q 'ipadctl config check' docs/quick-start.md
          grep -q 'ipadctl device list' docs/quick-start.md
          grep -q 'ipadctl platform check' docs/quick-start.md
          grep -q 'ipadctl bootstrap check' docs/quick-start.md

      - name: Configure SDK
        run: cmake -S ipa_sdk_pc -B ipa_sdk_pc/build -DCMAKE_BUILD_TYPE=Release

      - name: Build SDK
        run: cmake --build ipa_sdk_pc/build --parallel

      - name: Prepare SDK dist
        shell: bash
        run: |
          mkdir -p ipa_sdk_pc/dist/include ipa_sdk_pc/dist/lib
          cp -r ipa_sdk_pc/include/. ipa_sdk_pc/dist/include/
          find ipa_sdk_pc/build -type f \( -name 'libipa.a' -o -name 'libipa.so' -o -name 'libipa.so.*' \) -exec cp {} ipa_sdk_pc/dist/lib/ \;
          test -n "$(find ipa_sdk_pc/dist/lib -type f -name 'libipa.*' -print -quit)"

      - name: Configure manager components with real SDK headers
        run: cmake -S . -B build-manager-real-sdk -DIPAD_BUILD_TESTS=ON -DIPAD_WORKER_ENABLE_REAL_SDK=ON

      - name: Build manager components with real SDK headers
        run: cmake --build build-manager-real-sdk --parallel

      - name: Configure host app
        run: cmake -S ipad_host_app -B ipad_host_app/build -DCMAKE_BUILD_TYPE=Release -DIPAD_SDK_ROOT="${GITHUB_WORKSPACE}/ipa_sdk_pc"

      - name: Build host app
        run: cmake --build ipad_host_app/build --parallel

      - name: Inspect binary dependencies
        run: ldd ipad_host_app/build/ipad_host_app

  compatibility:
    name: Manager compatibility (${{ matrix.image }})
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:stable
            packages: build-essential cmake
            cmake_args: -DIPAD_BUILD_TESTS=ON
          - image: alpine:latest
            packages: build-base cmake
            cmake_args: -DIPAD_BUILD_TESTS=ON -DIPAD_STRICT_WARNINGS=OFF

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        shell: sh
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y ${{ matrix.packages }}
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache ${{ matrix.packages }}
          else
            echo "unsupported package manager"
            exit 1
          fi

      - name: Configure manager components
        run: cmake -S . -B build-compat ${{ matrix.cmake_args }}

      - name: Build manager components
        run: cmake --build build-compat --parallel

      - name: Run manager tests
        run: ctest --test-dir build-compat --output-on-failure
